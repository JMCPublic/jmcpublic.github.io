<style>
/* Film Charades (live 26 Nov 2026). Engine /charades/charades.js, films /charades/films.js, scenes /charades/stage.js, hosts /charades/hosts/. Mock-ups: /test/charades/v0.1–v0.3. */
.q{font:800 20px/1.2 Nunito,Inter,sans-serif;margin:6px 2px 4px}
.stage{background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden;margin-top:6px}
.stage svg{display:block;width:100%;height:auto}
.curtain{height:10px;background:repeating-linear-gradient(90deg,#b8322a 0 14px,#9b2620 14px 28px)}
.hosts{display:flex;gap:8px;align-items:flex-start;margin:10px 0 2px}
.hosts .av{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--line);overflow:hidden}
.hosts .av img{width:46px;height:46px;display:block}
.bub{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:9px 12px;font-size:15px;line-height:1.35;flex:1}
.bub small{display:block;font:800 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--cu);margin-bottom:2px}
.moreclue{display:block;margin:10px auto 2px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px;cursor:pointer}
.moreclue[disabled]{opacity:.35;cursor:default}
.pts{text-align:center;font-size:13.5px;color:var(--muted);margin:6px 0 6px}.pts b{color:var(--ink)}
.play .opts{margin-top:8px}.opt{padding:11px 13px;font-size:16px}
.q .lvl{position:static;display:inline-block;font:800 11px Inter;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:3px}
.lvl.e{background:#e3f3e9;color:#1f7a4a}.lvl.m{background:#fff1d6;color:#9a6200}.lvl.h{background:#fbe6e3;color:#c0392b}.lvl.b{background:#16130f;color:#ffd36b}
.prog i.h,.dots i.h{background:#d9a400}
.fact b.ttl2{font-size:14.5px;color:var(--ink)}
.intro p.sub{font:600 14px/1.3 Inter,system-ui,sans-serif;color:var(--cu);margin:-2px 0 10px}
.gicon{display:block;width:64px;height:64px;border-radius:16px;margin:0 0 10px}
.lvls{display:flex;gap:4px;background:#f1ece2;border-radius:999px;padding:4px;margin:14px 0 4px}
.lvls button{flex:1;border:0;background:none;border-radius:999px;padding:9px 2px;font:700 13.5px Inter,system-ui,sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
.lvls button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lvls button[disabled]{cursor:default}
.lvlh{font-size:13px;color:var(--muted);margin:2px 2px 6px;min-height:1em}
.again{margin-top:14px;text-align:center}.again b{display:block;font-size:17px;margin-bottom:2px}
@media (max-height:700px){.opt{padding:10px 12px;font-size:15.5px}.bub{font-size:14.5px}}
</style>
</head>
