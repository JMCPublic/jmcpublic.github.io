<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rivers (simple) · Shadow · Two Minute Games</title>
<meta name="theme-color" content="#f6f3ec">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/rivers-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Simple Rivers (shadow site, 17 Nov 2026): one river lights up on the map, pick its name from three.
   Ten a day, the same for everyone: four most people know, three that make you think, three clever ones. */
:root{--bg:#f6f3ec;--card:#fff;--ink:#16130f;--muted:#6f685d;--line:#e6e0d4;--accent:#e2552d;--cu:#b8663a;--good:#1f7a4a;--goodbg:#e3f3e9;--bad:#b3261e;--badbg:#fbe6e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;touch-action:manipulation}
a{color:inherit}
.bar{background:#fff3e8;font:600 12.5px Inter,system-ui,sans-serif;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-size:14px;color:var(--muted);text-decoration:none;padding:4px 0}
.ttl{display:flex;align-items:baseline;gap:8px}
.ttl h1{font:800 26px/1 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cu)}
.prog{display:flex;gap:5px;margin:12px 0 10px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.ok{background:var(--good)}.prog i.no{background:var(--bad)}.prog i.now{background:var(--accent)}
.mapcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:22px;padding:8px;height:min(40dvh,380px);min-height:220px;display:flex}
.mapcard svg{width:100%;height:100%}
.cname{position:absolute;top:10px;left:14px;font:800 19px Fraunces,Georgia,serif;pointer-events:none}
.lvl{position:absolute;top:12px;right:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q{font:600 22px/1.2 Fraunces,Georgia,serif;margin:14px 2px 4px}
.clue{color:var(--muted);font-size:15px;line-height:1.45;margin:0 2px 12px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;font-size:17px;font-weight:700;cursor:pointer;transition:border-color .12s,background .12s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;background:#f1ece2;color:var(--muted)}
@media(hover:hover){.opt:not([disabled]):hover{border-color:#bdb4a4}}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--good);background:var(--goodbg)}.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.fact{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.45}
.fact b{display:block;font-size:15.5px;margin-bottom:2px}
.fact b.g{color:var(--good)}.fact b.r{color:var(--bad)}
.next{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;padding:14px;cursor:pointer}
/* start + end */
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:14px}
.intro h2{font:800 30px/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:6px 0 8px}
.intro p{color:var(--muted);font-size:15.5px;line-height:1.5;margin:0 0 6px}
.intro ul{margin:10px 0 4px;padding-left:20px;color:var(--ink);font-size:15px;line-height:1.7}
.big{font:800 64px/1 Fraunces,Georgia,serif;letter-spacing:-.03em;margin:4px 0 6px}
.big small{font-size:28px;color:var(--muted)}
.verdict{font:600 20px/1.25 Fraunces,Georgia,serif;margin:0 0 10px}
.dots{display:flex;gap:6px;margin:12px 0 4px}.dots i{flex:1;height:10px;border-radius:5px}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}
.best{color:var(--muted);font-size:14px;margin:8px 0 0}
.list{margin-top:14px;display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;border-top:1px solid var(--line);padding-top:7px}
.li i{font-style:normal;width:18px;flex:none}.li span{color:var(--muted);font-size:13px}
.btns{display:grid;gap:9px;margin-top:16px}
.btn{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16.5px;padding:14px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.small{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
.hid{display:none!important}
@media (max-height:700px){.mapcard{height:34dvh;min-height:190px}.q{font-size:20px;margin-top:10px}.clue{margin-bottom:9px}.opt{padding:11px 12px;font-size:16px}}
</style>
</head>
<body>
<div class="bar">🕶️ Shadow site · simple Rivers · private test</div>
<div class="wrap" id="app"></div>
<script src="data.js?v=1"></script>
<script>
const W=520,$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
/* the day's ten: same for everyone, from the local date */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MIX={1:4,2:3,3:3};
function pick(seed){const r=rng('srivers:'+seed);let out=[];
  for(const t of [1,2,3]){out=out.concat(shuffle(SR.q.filter(q=>q.t===t),r).slice(0,MIX[t]))}
  return out.map(q=>({...q,opts:shuffle([q.r,...q.w],r)}))}
const LV={1:'Warm-up',2:'Think about it',3:'The clever one'};

function mapSVG(q){const sc=SR.scopes[q.s],clip=sc.type==='country',id='c'+Math.random().toString(36).slice(2,7);
  const rp=r=>r.lines.map(l=>'M'+l.map(p=>p[0]+' '+p[1]).join('L')).join('');const tgt=sc.rivers.find(r=>r.n===q.r);
  const cp=clip?`clip-path="url(#${id})"`:'';
  return `<svg viewBox="0 0 ${W} ${W}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of ${esc(sc.name)} with one river highlighted"><defs><clipPath id="${id}"><path d="${sc.d}"/></clipPath>
  <linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb37a"/><stop offset=".5" stop-color="#e2552d"/><stop offset="1" stop-color="#ff9a4d"/></linearGradient></defs>
  <path d="${sc.d}" fill="#16130f"/>
  ${sc.rivers.filter(r=>r!==tgt).map(r=>`<path d="${rp(r)}" fill="none" stroke="#6d655a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${cp}/>`).join('')}
  <path d="${rp(tgt)}" fill="none" stroke="#16130f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".6" ${cp}/>
  <path d="${rp(tgt)}" fill="none" stroke="url(#g${id})" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" ${cp}/></svg>`}

let S;
function start(seed,practice){S={seed,practice,qs:pick(seed),i:0,res:[],answered:false};playQ()}
function prog(){return `<div class="prog">${S.qs.map((_,k)=>`<i class="${k<S.res.length?(S.res[k]?'ok':'no'):k===S.i?'now':''}"></i>`).join('')}</div>`}
function playQ(){const q=S.qs[S.i],sc=SR.scopes[q.s];S.answered=false;
  app.innerHTML=`<div class="top"><a class="back" href="/shadow/wonders/">← Natural Wonders</a><span class="tag">${S.i+1} of ${S.qs.length}</span></div>
  ${prog()}<div class="mapcard"><span class="cname">${esc(sc.name)}</span><span class="lvl">${LV[q.t]}</span>${mapSVG(q)}</div>
  <div class="q">Which river is this?</div><p class="clue">${esc(q.c)}</p>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${'ABC'[k]}</span>${esc(o)}</button>`).join('')}</div><div id="after"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.o));scrollTo(0,0)}
function answer(o){if(S.answered)return;S.answered=true;const q=S.qs[S.i],ok=o===q.r;S.res.push(ok);
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=b.dataset.o;b.classList.add(v===q.r?'ok':v===o?'no':'dim')});
  app.querySelector('.prog').outerHTML=prog();
  const last=S.i===S.qs.length-1;
  $('#after').innerHTML=`<div class="fact"><b class="${ok?'g':'r'}">${ok?['Yes!','Spot on.','Correct!','Nicely done.'][S.i%4]:'It’s the '+esc(q.r)+'.'}</b>${esc(q.f)}</div><button class="next">${last?'See my score':'Next river →'}</button>`;
  $('#after .next').onclick=()=>{if(last)end();else{S.i++;playQ()}};
  $('#after').scrollIntoView({block:'nearest',behavior:'smooth'})}
function verdict(n){return n===10?'Perfect! River royalty. 🏆':n>=8?'Brilliant. You really know your rivers.':n>=6?'Nicely done, a solid score.':n>=4?'Not bad! The clever ones are clever for everyone.':'A tough set today. Tomorrow brings ten fresh rivers.'}
function end(){const n=S.res.filter(Boolean).length,key='srivers-best';let best=+ls(key)||0;const newBest=!S.practice&&n>best;if(newBest){best=n;ls(key,String(n))}
  if(!S.practice)ls('srivers-day',S.seed+':'+n);
  const share=`Rivers · twominute.games\n${S.res.map(x=>x?'🟩':'🟥').join('')} ${n}/10`;
  app.innerHTML=`<div class="top"><a class="back" href="/shadow/wonders/">← Natural Wonders</a><span class="tag">${S.practice?'Practice set':'Today'}</span></div>
  <div class="panel"><div class="tag">Your score</div><div class="big">${n}<small> / 10</small></div><p class="verdict">${verdict(n)}</p>
  <div class="dots">${S.res.map(x=>`<i class="${x?'ok':'no'}"></i>`).join('')}</div>
  <p class="best">${newBest?'🎉 Your best score yet':best?'Your best: '+best+' / 10':''}</p>
  <div class="list">${S.qs.map((q,k)=>`<div class="li"><i>${S.res[k]?'✅':'❌'}</i><div><b>${esc(q.r)}</b> <span>· ${esc(SR.scopes[q.s].name)}</span></div></div>`).join('')}</div>
  <div class="btns"><button class="btn" id="share">Share my score</button><button class="btn ghost" id="again">Try a practice set</button><a class="btn ghost" href="/shadow/wonders/">More games</a></div>
  <p class="small">Ten new rivers every day at midnight, the same for everyone.</p></div>`;
  $('#share').onclick=async()=>{try{if(navigator.share){await navigator.share({text:share+'\nhttps://twominute.games/'})}else{await navigator.clipboard.writeText(share+'\nhttps://twominute.games/');$('#share').textContent='Copied ✓'}}catch(e){}};
  $('#again').onclick=()=>start(today()+':p'+Date.now(),true);scrollTo(0,0)}
function intro(){const done=(ls('srivers-day')||'').split(':');const played=done[0]===today();
  app.innerHTML=`<div class="top"><a class="back" href="/shadow/wonders/">← Natural Wonders</a></div>
  <div class="panel intro"><div class="ttl"><span class="tag">Natural Wonders · simple</span></div><h2>Rivers</h2>
  <p>A river lights up on the map. Which one is it? Pick from three.</p>
  <ul><li>Ten rivers, about two minutes</li><li>Starts easy, ends with a couple of clever ones</li><li>A fact about every river</li></ul>
  <div class="btns"><button class="btn" id="go">${played?'Play again (today’s set)':'Start'}</button>${played?`<p class="best" style="text-align:center">Today you scored ${done[1]} / 10</p>`:''}</div></div>`;
  $('#go').onclick=()=>start(today(),played)}
intro();
</script>
</body>
</html>
