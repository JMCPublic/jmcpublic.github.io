<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming soon · Shadow · Two Minute Games</title>
<meta name="theme-color" content="#212121">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Shadow site (17 Nov 2026): a game whose simpler version isn't built yet */
:root{--bg:#212121;--card:#2b2b2b;--cardline:#3a3a3a;--soft:#9AA0A6;--hot:#FF9100;--deep:#DD2C00;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:#fff;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh}
a{color:inherit;text-decoration:none}
.bar{position:relative;z-index:5;background:#fff3e8;color:#16130f;font:600 13px Inter,system-ui,sans-serif;text-align:center;padding:7px 12px}
.bg{position:absolute;left:0;right:0;top:0;height:620px;overflow:hidden;pointer-events:none}
.glow{position:absolute;width:min(1100px,150vw);height:560px;left:-14vw;top:-320px;background:radial-gradient(closest-side,var(--hot),var(--deep) 55%,transparent);opacity:.85;filter:blur(30px)}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom))}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;display:inline-flex;align-items:center;line-height:1}
.brand .o{width:12px;height:12px;border-radius:50%;border:3.5px solid #fff;margin-right:7px}.brand .tld{color:#ffd2b0}
.card{margin-top:70px;background:var(--card);border:1px solid var(--cardline);border-radius:24px;padding:30px 24px;text-align:center}
.card img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 24px -10px rgba(0,0,0,.7)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:18px 0 6px}
.k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ffd2b0}
p{color:#d9d6d2;font-size:15.5px;line-height:1.5;margin:10px 0 0}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{border-radius:999px;padding:11px 20px;font-weight:700;font-size:14.5px;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--hot),var(--deep)) border-box}
.btn.g{border:1.5px solid rgba(255,255,255,.3);background:none}
</style>
</head>
<body>
<div class="bar">🕶️ Shadow site · the simpler versions · private, not linked anywhere</div>
<div class="bg"><div class="glow"></div></div>
<div class="wrap">
<a class="brand" href="/shadow/"><span class="o"></span>twominute<span class="tld">.games</span></a>
<div class="card">
  <img id="ic" src="/icons/natural-wonders-180.png" alt="">
  <div style="margin-top:14px"><span class="k">Coming soon</span></div>
  <h1 id="nm">This game</h1>
  <p id="tx">We're making a simpler version: quick questions, three answers to pick from, mostly ones you'll know and one or two to make you think.</p>
  <div class="btns"><a class="btn" href="/shadow/rivers/">Try simple Rivers</a><a class="btn g" id="back" href="/shadow/wonders/">← Back</a></div>
</div>
</div>
<script>
const N={aperture:'Aperture',landmarks:'Landmarks',masterbrain:'Masterbrain',rivers:'Rivers',lakes:'Lakes','bodies-of-water':'Bodies of Water',mountains:'Mountains',deserts:'Deserts',forests:'Forests','how-many-borders':'How Many Borders?','river-cities':'River Cities','where-is-bigger':'Where is Bigger?','which-of-five':'Which of Five?'};
const g=new URLSearchParams(location.search).get('g')||'';
if(N[g]){document.getElementById('nm').textContent=N[g];document.getElementById('ic').src='/icons/'+g+'-180.png';document.title=N[g]+' · Coming soon · Shadow'}
if(g==='aperture'||g==='landmarks')document.getElementById('back').href='/shadow/';
</script>
</body>
</html>
