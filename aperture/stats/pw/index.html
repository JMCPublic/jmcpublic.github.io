<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stats password maker</title>
<style>
body{margin:0;background:#f1f3f7;color:#16181d;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
.c{max-width:440px;margin:30px auto;background:#fff;border:1.5px solid #e3e6eb;border-radius:20px;padding:22px}
h1{font-size:22px;margin:0 0 6px}p{color:#5b606b;margin:0 0 14px;font-size:14.5px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;font:inherit;border:1.5px solid #b9c0cb;border-radius:12px;padding:10px 12px}
button{margin-top:16px;width:100%;border:0;border-radius:999px;background:#16181d;color:#fff;font:600 15px system-ui;padding:12px;cursor:pointer}
.out{margin-top:16px;background:#eef7f0;border-radius:12px;padding:12px;font-size:14px;word-break:break-all}.out code{font:600 14px ui-monospace,Menlo,monospace}
.err{color:#b3261e;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="c">
  <h1>Make a stats password</h1>
  <p>Type the password you want for the stats page. This page turns it into a scrambled code on this device; nothing is sent anywhere. Send Claude only the code, never the password.</p>
  <label for="a">New password</label><input id="a" type="password" autocomplete="new-password">
  <label for="b">Type it again</label><input id="b" type="password" autocomplete="new-password">
  <button id="go" type="button">Make the code</button>
  <div id="msg"></div>
</div>
<script>
/* Same recipe as the stats page: PBKDF2, SHA-256, 150,000 rounds, fixed salt. Only the code is ever shared. */
async function code(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('tmg-stats-2026'),iterations:150000},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('go').onclick=async()=>{const a=document.getElementById('a').value,b=document.getElementById('b').value,m=document.getElementById('msg');
  if(a.length<8){m.innerHTML='<p class="err">Please use at least 8 characters.</p>';return}
  if(a!==b){m.innerHTML='<p class="err">The two passwords don’t match.</p>';return}
  const c=await code(a);m.innerHTML=`<div class="out">Your code (send this to Claude):<br><code>${c}</code></div>`;document.getElementById('a').value='';document.getElementById('b').value=''};
</script>
</body>
</html>
