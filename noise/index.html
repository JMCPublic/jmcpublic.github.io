<!-- What’s That Noise? (live 17 Nov 2026): a twominute.games listening game. Engine and look shared with the other listening game in /shared/listen.js and /shared/listen.css. -->
<script>
/* What's That Noise? Five sounds a day: two warm-ups, two think-about-its, one clever one.
   Every sound is synthesised in the browser. Each item: t tier, n answer, w two wrong answers, f fact, p plays it (returns seconds). */
const rep=(n,fn)=>{for(let i=0;i<n;i++)fn(i)};
const SOUNDS=[
/* ---------- warm-ups ---------- */
{t:1,n:'Doorbell',w:['Lift arriving','Bicycle bell'],f:'The classic ding-dong is one plunger hitting two metal bars: one on the way out, one on the way back.',
 p:A=>{const t=A.t;rep(2,i=>{const s=t+i*2.1;A.bell(659,s,1.4,.3,[[1,1],[2,.25],[3,.08]]);A.bell(523,s+.6,1.8,.3,[[1,1],[2,.25],[3,.08]])});return 4.4}},
{t:1,n:'Old telephone ringing',w:['Fire alarm','Bicycle bell'],f:'Old phones had a real bell with a tiny hammer. The British "brr-brr" double ring is different from the long single ring in the USA.',
 p:A=>{const t=A.t;[[0,.4],[.6,.4],[2.2,.4],[2.8,.4]].forEach(([s,d])=>{A.tone(1300,t+s,d,{type:'triangle',g:.14,am:[22,1]});A.tone(1650,t+s,d,{type:'triangle',g:.1,am:[22,1]})});return 3.4}},
{t:1,n:'Emergency siren',w:['Car alarm','Smoke alarm'],f:'The two-note "nee-naw" was the sound of British emergency vehicles for decades. Many now use a rising wail as well.',
 p:A=>{const t=A.t;rep(6,i=>A.tone(i%2?720:960,t+i*.55,.55,{type:'square',g:.08,lp:2200,a:.02,r:.03}));return 3.4}},
{t:1,n:'Ticking clock',w:['Dripping tap','Footsteps'],f:'"Tick" and "tock" really do sound different: the escapement catches on one side, then the other.',
 p:A=>{const t=A.t;rep(7,i=>A.noise(t+i*.55,.03,{f:i%2?1800:2600,q:6,g:.9,a:.001,r:.025}));return 3.9}},
{t:1,n:'Alarm clock',w:['Reversing lorry','Microwave finishing'],f:'Seth E. Thomas patented a wind-up mechanical alarm clock in 1876. The beeping digital ones came a century later.',
 p:A=>{const t=A.t;rep(3,g=>rep(4,i=>A.tone(2050,t+g*1+i*.13,.07,{type:'square',g:.07,lp:5000,a:.002,r:.01})));return 3}},
{t:1,n:'Cuckoo clock',w:['Owl hooting','Doorbell'],f:'Black Forest clockmakers copied the real bird with two tiny bellows-driven pipes, a few notes apart.',
 p:A=>{const t=A.t;rep(3,i=>{const s=t+i*1;A.tone(784,s,.28,{type:'triangle',g:.25,a:.03,r:.12});A.noise(s,.25,{f:784,q:20,g:.15});A.tone(659,s+.32,.4,{type:'triangle',g:.25,a:.03,r:.2});A.noise(s+.32,.35,{f:659,q:20,g:.15})});return 3.2}},
{t:1,n:'Thunderstorm',w:['Fireworks','Heavy traffic'],f:'Count the seconds between the flash and the rumble, then divide by three: that’s roughly how many kilometres away the storm is.',
 p:A=>{const t=A.t;A.noise(t,4.5,{ft:'highpass',f:3000,g:.05,a:.5,r:1});A.noise(t+.3,.25,{ft:'lowpass',f:4000,g:.5,a:.003,r:.2});A.noise(t+.35,3.6,{ft:'lowpass',f:160,q:.8,g:.9,a:.15,r:2.4,am:[3,.5]});return 4.5}},
{t:1,n:'Waves on a beach',w:['Wind in the trees','Traffic on a motorway'],f:'Most waves are made by wind, sometimes blowing thousands of kilometres out at sea.',
 p:A=>{const t=A.t;rep(2,i=>{const s=t+i*2.3;A.noise(s,2.6,{ft:'lowpass',f:300,f2:1400,gt:1.2,g:.6,a:1.1,r:1.3})});return 5}},
{t:1,n:'Referee’s whistle',w:['Kettle boiling','Bird singing'],f:'The Acme Thunderer, made in Birmingham since 1884, has been blown at matches all over the world. The little ball inside makes the trill.',
 p:A=>{const t=A.t;[[0,.25],[.4,.25],[.8,1.1]].forEach(([s,d])=>{A.tone(2900,t+s,d,{g:.18,am:[28,.6],a:.01,r:.05});A.noise(t+s,d,{f:2900,q:8,g:.12,am:[28,.6]})});return 2.1}},
{t:1,n:'Boxing ring bell',w:['Bicycle bell','School bell'],f:'Ding-ding-ding: one bell starts the round, and pro boxers then fight for three minutes before it rings again.',
 p:A=>{const t=A.t;rep(3,i=>A.bell(880,t+i*.38,1.6,.3));return 2.6}},
{t:1,n:'Heartbeat',w:['Someone knocking on a door','Distant drum'],f:'A resting adult heart beats about 60 to 100 times a minute, and a little faster when you’re concentrating on a quiz.',
 p:A=>{const t=A.t;rep(4,i=>{const s=t+i*.85;A.tone(90,s,.14,{f2:45,g:.9,a:.005,r:.1});A.tone(80,s+.24,.12,{f2:40,g:.6,a:.005,r:.09})});return 3.6}},
{t:1,n:'Car horn',w:['Foghorn','Goose honking'],f:'Most cars have two horns tuned a few notes apart, which together sound louder and harsher than one.',
 p:A=>{const t=A.t;[[0,.22],[.35,.9]].forEach(([s,d])=>{A.tone(415,t+s,d,{type:'sawtooth',g:.12,lp:1800,a:.01,r:.04});A.tone(495,t+s,d,{type:'sawtooth',g:.1,lp:1800,a:.01,r:.04})});return 1.5}},
{t:1,n:'Kettle whistling',w:['Steam train whistle','Referee’s whistle'],f:'A whistling kettle works like a flute: steam rushing through two small holes makes the air between them vibrate.',
 p:A=>{const t=A.t;A.noise(t,3.5,{ft:'highpass',f:2000,g:.06,a:1,r:.3});A.tone(1400,t+.6,2.9,{f2:2300,gt:2.4,g:.14,a:1.4,r:.3,vib:[6,15]});A.noise(t+.6,2.9,{f:1800,f2:2300,gt:2.4,q:15,g:.2,a:1.4,r:.3});return 3.6}},
/* ---------- think about it ---------- */
{t:2,n:'Mosquito',w:['Bee','Electric shaver'],f:'Only female mosquitoes bite. The whine is their wings, beating several hundred times a second.',
 p:A=>{const t=A.t;A.tone(620,t,3.2,{type:'sawtooth',g:.06,lp:3000,vib:[7,25],a:1.2,r:1.4,am:[.4,.6]});return 3.3}},
{t:2,n:'Crickets',w:['Smoke alarm low battery','Birdsong'],f:'Count a cricket’s chirps in 14 seconds and add 40, and you get roughly the temperature in Fahrenheit. It’s called Dolbear’s law.',
 p:A=>{const t=A.t;rep(7,c=>{rep(3,i=>A.tone(4500,t+c*.5+i*.04,.025,{g:.06,a:.003,r:.01}));rep(3,i=>A.tone(4850,t+c*.5+.22+i*.04,.025,{g:.04,a:.003,r:.01}))});return 3.6}},
{t:2,n:'Lorry reversing',w:['Pedestrian crossing','Microwave finishing'],f:'Many new lorries use a "white noise" reversing alarm instead: easier to tell where it’s coming from, and kinder to the neighbours.',
 p:A=>{const t=A.t;rep(4,i=>A.tone(1100,t+i*.9,.45,{type:'square',g:.07,lp:3000,a:.005,r:.02}));return 3.5}},
{t:2,n:'Fireworks',w:['Thunderstorm','Popcorn popping'],f:'A firework’s whistle comes from a special powder in a tube that burns in rapid, tiny pulses.',
 p:A=>{const t=A.t;[0,1.9].forEach(s=>{A.tone(900,t+s,1,{f2:2600,g:.07,a:.05,r:.05});A.noise(t+s+1.05,.4,{ft:'lowpass',f:1500,g:.8,a:.003,r:.35});rep(22,i=>A.noise(t+s+1.15+Math.random()*1.1,.012,{f:3000+Math.random()*3000,q:3,g:.35,a:.001,r:.01}))});return 4.4}},
{t:2,n:'Typewriter',w:['Computer keyboard','Hail on a roof'],f:'The little bell warns you you’re near the end of the line. Then you push the carriage back across with a lever.',
 p:A=>{const t=A.t;let s=0;rep(12,()=>{A.noise(t+s,.03,{f:1800+Math.random()*1200,q:4,g:.7,a:.001,r:.025});s+=.11+Math.random()*.12});A.bell(2100,t+s+.1,1,.18);A.noise(t+s+.5,.45,{f:800,f2:2000,q:2,g:.3,a:.02,r:.1});return s+1.1}},
{t:2,n:'Dripping tap',w:['Ticking clock','Bubbles'],f:'The "plink" isn’t the drop hitting the water. It’s a tiny air bubble trapped underneath, vibrating.',
 p:A=>{const t=A.t;[0,.8,1.5,2.4,3.1].forEach(s=>A.tone(700,t+s,.12,{f2:1700,gt:.05,g:.35,a:.003,r:.08}));return 3.4}},
{t:2,n:'Morse code SOS',w:['Reversing lorry','Pedestrian crossing'],f:'SOS was picked because dot-dot-dot, dash-dash-dash, dot-dot-dot is easy to send and hard to mistake. The letters don’t stand for anything.',
 p:A=>{const t=A.t;let s=0;'...---...'.split('').forEach(c=>{const d=c==='.'?.1:.3;A.tone(700,t+s,d,{g:.2,a:.005,r:.01});s+=d+.1});return s+.3}},
{t:2,n:'Foghorn',w:['Car horn','Cow mooing'],f:'Many foghorns have been switched off now that ships have radar and GPS, but a few lighthouses still sound them.',
 p:A=>{const t=A.t;A.tone(180,t,1.3,{type:'sawtooth',g:.2,lp:700,a:.15,r:.1});A.tone(120,t+1.25,1.6,{type:'sawtooth',g:.22,lp:600,a:.05,r:.6});return 3.1}},
{t:2,n:'Helicopter',w:['Washing machine spinning','Motorbike'],f:'The "chop-chop" is each rotor blade slicing through the swirl of air left by the blade in front.',
 p:A=>{const t=A.t;A.noise(t,3.6,{ft:'lowpass',f:500,g:.9,a:.8,r:.8,am:[13,.9]});A.tone(3200,t,3.6,{g:.012,a:1,r:.8});return 3.7}},
{t:2,n:'Steam train',w:['Steam iron','Pressure cooker'],f:'Each "chuff" is used steam blasted up the chimney, which also pulls air through the fire to keep it burning hot.',
 p:A=>{const t=A.t;let s=0,gap=.5;rep(9,()=>{A.noise(t+s,.16,{f:900,q:1.2,g:.6,a:.01,r:.12});s+=gap;gap*=.9});A.tone(698,t+s,1.2,{type:'square',g:.05,lp:1800,a:.08,r:.3});A.tone(880,t+s,1.2,{type:'square',g:.04,lp:1800,a:.08,r:.3});return s+1.3}},
{t:2,n:'Big Ben’s chimes',w:['Wedding bells','Ice cream van'],f:'Big Ben is the name of the great bell, not the clock tower. The tower was renamed Elizabeth Tower in 2012.',
 p:A=>{const t=A.t;['G#4','F#4','E4','B3','E4','G#4','F#4','B3'].forEach((n,i)=>A.bell(A.hz(n),t+i*.75,2.2,.22));return 7.5}},
{t:2,n:'Ice cream van',w:['Musical box','Doorbell'],f:'Lots of British ice cream vans play Greensleeves, an English tune from the 1500s. Legend says Henry VIII wrote it, but historians doubt it.',
 p:A=>A.melody([['A4',.5],['C5',1],['D5',.5],['E5',.75],['F5',.25],['E5',.5],['D5',1],['B4',.5],['G4',.75],['A4',.25],['B4',.5],['C5',1],['A4',.5],['A4',.75],['G#4',.25],['A4',.5],['B4',1],['G#4',.5],['E4',1]],170,
   (f,t,d)=>A.tone(f*2,t,d*.95,{type:'square',g:.05,lp:3500,vib:[6,f*.02],a:.01,r:.05}))},
{t:2,n:'Applause',w:['Heavy rain','Bacon frying'],f:'Big crowds often drift into clapping in time without meaning to. Scientists have studied how it happens.',
 p:A=>{const t=A.t;for(let i=0;i<360;i++){const s=Math.random()*3.2,sw=Math.min(1,s/.8)*Math.min(1,(3.4-s)/.8);A.noise(t+s,.012,{f:1200+Math.random()*2500,q:2,g:.25*sw,a:.001,r:.01})}return 3.5}},
/* ---------- the clever ones ---------- */
{t:3,n:'Ping-pong ball bouncing',w:['Ticking clock','Dripping tap'],f:'Every bounce is shorter than the one before, because the ball loses a little energy as heat and sound each time it lands.',
 p:A=>{const t=A.t;let s=0,gap=.55;rep(14,()=>{A.noise(t+s,.02,{f:2600,q:5,g:.8,a:.001,r:.018});A.tone(1100,t+s,.04,{g:.08,a:.001,r:.03});s+=gap;gap*=.82});return s+.3}},
{t:3,n:'Engaged tone',w:['Reversing lorry','Smoke alarm low battery'],f:'Every country has its own phone tones. The UK engaged tone is a steady on-off beep at 400 hertz.',
 p:A=>{const t=A.t;rep(5,i=>A.tone(400,t+i*.75,.375,{g:.2,a:.005,r:.01}));return 3.6}},
{t:3,n:'Pedestrian crossing',w:['Reversing lorry','Alarm clock'],f:'On many UK crossings there’s a little cone under the button. It spins when it’s safe to cross, for people who can’t see or hear the signal.',
 p:A=>{const t=A.t;rep(22,i=>A.tone(2500,t+i*.14,.06,{type:'square',g:.05,lp:5000,a:.002,r:.01}));return 3.2}},
{t:3,n:'Tawny owl',w:['Pigeon cooing','Wind in a chimney'],f:'The famous "twit-twoo" is usually two owls: the female calls "ke-wick" and the male answers "hoo-hoo".',
 p:A=>{const t=A.t;A.tone(420,t,.6,{f2:380,g:.2,a:.08,r:.3,type:'triangle'});A.tone(400,t+1.3,.2,{g:.15,a:.03,r:.1,type:'triangle'});A.tone(430,t+1.6,1.6,{f2:390,g:.2,a:.1,r:.6,type:'triangle',am:[9,.6]});return 3.4}},
{t:3,n:'Geiger counter',w:['Crackling fire','Old film projector'],f:'Each click is a single particle of radiation passing through the counter’s gas-filled tube.',
 p:A=>{const t=A.t;let s=0;while(s<3.4){A.noise(t+s,.006,{ft:'highpass',f:2000,g:.9,a:.0005,r:.005});s+=-Math.log(Math.random())*(.25-s*.06)}return 3.5}},
{t:3,n:'Submarine sonar',w:['Doorbell','Wine glass being rung'],f:'Sonar measures distance by timing the echo. Sound travels about 1,500 metres a second in seawater.',
 p:A=>{const t=A.t;[0,2].forEach(s=>{A.tone(1450,t+s,1.6,{g:.25,a:.005,r:1.5});A.tone(1450,t+s+.6,1.2,{g:.06,a:.005,r:1.1})});return 4}},
{t:3,n:'Woodpecker',w:['Road drill','Someone knocking on a door'],f:'A woodpecker can drum about 20 times a second. Its skull is built to soak up the shock.',
 p:A=>{const t=A.t;[0,1.6].forEach(s=>rep(13,i=>A.noise(t+s+i*.05,.02,{f:1300,q:7,g:.9*(1-i/18),a:.001,r:.018})));return 2.6}},
{t:3,n:'Bumblebee',w:['Mosquito','Electric toothbrush'],f:'A bumblebee’s buzz is lower than a mosquito’s because its bigger wings beat more slowly, about 200 times a second.',
 p:A=>{const t=A.t;A.tone(190,t,3.2,{type:'sawtooth',g:.1,lp:1400,vib:[4,12],a:.8,r:1,am:[.6,.5]});return 3.3}},
{t:3,n:'Camera shutter',w:['Stapler','Light switch'],f:'Phone cameras have no shutter to click. The sound is a recording, added so people know a photo has been taken.',
 p:A=>{const t=A.t;[0,1.4].forEach(s=>{A.noise(t+s,.03,{f:4500,q:3,g:.8,a:.001,r:.025});A.noise(t+s+.09,.04,{f:3000,q:3,g:.6,a:.001,r:.03})});return 2}},
{t:3,n:'Cash register',w:['Bicycle bell','Slot machine'],f:'James Ritty, a saloon owner in Ohio, invented the cash register in 1879 to stop staff pocketing the takings.',
 p:A=>{const t=A.t;A.noise(t,.05,{f:2500,q:4,g:.7,a:.001,r:.04});A.noise(t+.12,.05,{f:2000,q:4,g:.6,a:.001,r:.04});A.bell(2600,t+.25,1.6,.25);A.noise(t+.35,.5,{ft:'lowpass',f:900,g:.4,a:.02,r:.2});return 2}},
];
window.CFG={icon:'/icons/noise-180.png?v=3',key:'noise',name:'What’s That Noise?',kicker:'Sounds · daily',
  intro:'An everyday sound plays. What is it? Pick from three.',
  bullets:['Five sounds, about two minutes','Starts easy, ends with a clever one','A fact about every one'],
  q:'What’s that noise?',clue:'Listen, then pick what you heard. Play it again as often as you like.',
  per:5,mix:{1:2,2:2,3:1},next:'Next sound',tomorrow:'Five new sounds tomorrow, the same for everyone.',
  verdicts:['Perfect! Ears like a bat 🦇','Brilliant. Sharp ears today.','Nicely done, a solid score.','Not bad! The clever one is clever for everyone.','A tough set. Tomorrow brings five fresh sounds.'],
  other:{img:'/icons/classic-180.png?v=3',e:'🎻',n:'Name That Classic',d:'Ten famous classical tunes a day.',href:'/classic/'},
  items:SOUNDS};
</script>
